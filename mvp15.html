<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luís Paulo Fontes — MVP v15</title><style>body{font-family:Arial;margin:0;background:#eef1f4}.box{max-width:700px;margin:20px auto;background:white;border-radius:16px;overflow:hidden}.h{background:#111827;color:white;padding:18px;display:flex;justify-content:space-between}.chat{height:560px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai{background:white}.u{background:#d9fdd3;margin-left:auto}.f{display:flex;gap:8px;padding:12px}.f input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}.f button,.h button{padding:10px 15px;border:0;border-radius:10px;background:#111827;color:white;font-weight:bold}.h button{background:white;color:#111827}</style><div class="box"><div class="h"><b>Luís Paulo Fontes<br><small>MVP — teste da conversa comercial v15</small></b><button onclick="novo()">Novo atendimento</button></div><div id="c" class="chat"></div><div class="f"><input id="i" placeholder="Digite como cliente..."><button onclick="enviar()">Enviar</button></div></div><script>let s={step:'name',name:'',cnpj:'',bank:'',machine:'',turnover:0};const c=document.getElementById('c'),i=document.getElementById('i');function add(t,u=false){c.innerHTML+='<div class="m '+(u?'u':'ai')+'">'+t+'</div>';c.scrollTop=c.scrollHeight}function novo(){s={step:'name',name:'',cnpj:'',bank:'',machine:'',turnover:0};c.innerHTML='';add('Oi! Tudo bem? Aqui é o Luís.');setTimeout(()=>add('Com quem eu estou falando?'),1200)}function n(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function enviar(){let x=i.value.trim();if(!x)return;add(x,true);i.value='';setTimeout(()=>r(x),500)}function r(x){let q=n(x);if(s.step==='name'){s.name=x.split(/\s+/)[0];s.step='interest';add('Prazer, '+s.name+'! Me conta, o que você está procurando hoje para sua empresa?');return}if(s.step==='interest'){s.step='cnpj';add('Perfeito, '+s.name+'. Para eu verificar a disponibilidade das soluções para sua empresa, me informe o CNPJ, por favor.');return}if(s.step==='cnpj'){let d=x.replace(/\D/g,'');if(d.length<11){add('Pode me informar o CNPJ completo, por favor?');return}s.cnpj=d;s.step='availability';add('Obrigado, '+s.name+'. Já recebi o CNPJ. Vou verificar a disponibilidade. Quando você consultar, me informe apenas se está disponível ou indisponível.');return}if(s.step==='availability'){if(/indisponivel|nao tem|sem produto|nao disponivel/.test(q)){add('Entendi, '+s.name+'. No momento não temos uma solução disponível para este CNPJ. Agradeço pelo seu contato e podemos avaliar novamente caso a disponibilidade mude.');s.step='closed';return}if(/disponivel|tem produto|sim/.test(q)){s.step='account';add('Perfeito, '+s.name+'. Vamos continuar. Hoje você já possui uma conta PJ? Se sim, qual banco você utiliza?');return}add('Para eu continuar, me informe se o produto está disponível ou indisponível para este CNPJ.');return}if(s.step==='account'){if(q.includes('santander')){if(/\bpf\b|pessoa fisica/.test(q)){s.step='machine';add('Perfeito, '+s.name+'. Entendi que sua conta Santander é pessoa física. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?');}else{add('Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base Santander. Nesse caso, peço que direcione o atendimento para o especialista responsável pela sua conta ou procure a agência responsável pelo seu CNPJ.');s.step='closed'}return}if(/\bnao\b|não tenho/.test(q)){s.step='turnover';add('Entendi, '+s.name+'. E quanto sua empresa fatura aproximadamente por mês?');return}if(q.includes('itau')||q.includes('itaú'))s.bank='Itaú';if(q.includes('stone'))s.machine='Stone';if(s.bank&&s.machine){s.step='turnover';add('Perfeito, '+s.name+'. Entendi que você utiliza o Itaú e a Stone. Quanto sua empresa fatura aproximadamente por mês?');return}add('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?');return}if(s.step==='machine'){if(q.includes('stone'))s.machine='Stone';s.step='turnover';add('Perfeito, '+s.name+'. Quanto sua empresa fatura aproximadamente por mês?');return}if(s.step==='turnover'){let v=parseFloat(q.replace(/\./g,'').replace(',','.').replace(/[^0-9.]/g,''));if(q.includes('mil'))v*=1000;if(!v){add('Pode me passar uma média mesmo, '+s.name+'. Não precisa ser exato.');return}s.turnover=v;s.step='pain';add('Perfeito, '+s.name+'. Então estamos falando de uma empresa '+(v>40000?'acima de R$ 40 mil':'até R$ 40 mil')+'. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?');return}if(s.step==='pain'){s.step='advance';add('Entendi, '+s.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, já avançar?');return}if(s.step==='advance'){s.step='meeting';add('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?');return}if(s.step==='meeting'){if(/online|virtual|remota/.test(q))s.meeting='online';else if(/presencial|pessoalmente/.test(q))s.meeting='presencial';if(/segunda|terca|quarta|quinta|sexta|sabado|domingo/.test(q))s.day=x;if(/\b([01]?\d|2[0-3])\s*(h|horas)?\b/.test(q)){let m=q.match(/\b([01]?\d|2[0-3])\s*(h|horas)?\b/);s.time=m[1]+'h'}if(s.meeting&&s.day&&s.time){s.step='confirmed';add('Perfeito, '+s.name+'. Reunião confirmada: '+s.meeting+', '+s.day+' às '+s.time+'. Até lá!');}else if(s.meeting)add('Perfeito, '+s.name+'. Qual dia e horário ficam melhores para você?');else add('Perfeito, '+s.name+'. Você prefere fazer online ou pessoalmente?');return}if(s.step==='confirmed')add('Perfeito, '+s.name+'. Até lá! 👋')}function start(){novo()}start();i.addEventListener('keydown',e=>{if(e.key==='Enter')enviar()})</script>
