services:
  - type: web
    name: luis-chatbot-mvp
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v20.0
      - key: AI_ASSIST_ENABLED
        value: "false"
      - key: CRM_ADMIN_USER
        sync: false
      - key: CRM_ADMIN_PASSWORD
        sync: false
      - key: CRM_AUTH_SECRET
        sync: false
      - key: WHATSAPP_QR_SESSION_DIR
        value: /tmp/luis-whatsapp-sessions
