<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luís Paulo Fontes — MVP</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif}.box{max-width:700px;margin:20px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0002}header{background:#111827;color:#fff;padding:18px}header b{font-size:20px}header small{display:block;opacity:.75;margin-top:5px}.chat{height:560px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai{background:#fff;border-bottom-left-radius:5px}.client{background:#d9fdd3;margin-left:auto;border-bottom-right-radius:5px}.typing{height:25px;padding:4px 18px;background:#e9eef2;color:#667085;font-size:12px}footer{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}button{padding:0 20px;border:0;border-radius:12px;background:#111827;color:white;font-weight:700}@media(max-width:720px){.box{margin:0;border-radius:0}.chat{height:calc(100vh - 155px)}}</style></head><body><div class="box"><header><b>Luís Paulo Fontes</b><small>MVP — teste da conversa comercial</small></header><div id="chat" class="chat"></div><div id="typing" class="typing"></div><footer><input id="input" placeholder="Digite como cliente..." autocomplete="off"><button id="send">Enviar</button></footer></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),typing=document.getElementById('typing');let state={name:null,step:'name',busy:false,interest:null,turnover:null,base:false,meetingType:null,meetingDay:null,meetingDate:null,meetingTime:null};let buffer=[],debounce=null;function add(t,w){let d=document.createElement('div');d.className='m '+w;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function say(t){state.busy=true;send.disabled=true;input.disabled=true;typing.textContent='Luís está digitando...';let delay=Math.min(10500,Math.max(4000,3000+t.length*48));setTimeout(()=>{typing.textContent='';add(t,'ai');state.busy=false;send.disabled=false;input.disabled=false;input.focus()},delay)}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function money(s){let n=norm(s).replace(/\./g,'').replace(',','.');let m=n.match(/(\d+(?:\.\d+)?)\s*(k|mil|milhao|milhoes)?/);if(!m)return null;let v=parseFloat(m[1]);if(m[2]==='k'||m[2]==='mil')v*=1000;if(m[2]&&m[2].startsWith('milhao'))v*=1000000;return v}function faixa(v){if(v>500000)return 'acima de R$ 500 mil';if(v>100000)return 'acima de R$ 100 mil';if(v>40000)return 'acima de R$ 40 mil';if(v>10000)return 'acima de R$ 10 mil';return 'até R$ 10 mil'}function parseMeeting(s){let n=norm(s),day=null;if(/segunda|\b2a\b|\bseg\b/.test(n))day='segunda-feira';else if(/terca|\b3a\b|\bter\b/.test(n))day='terça-feira';else if(/quarta|\b4a\b|\bqua\b/.test(n))day='quarta-feira';else if(/quinta|\b5a\b|\bqui\b/.test(n))day='quinta-feira';else if(/sexta|\b6a\b|\bsex\b/.test(n))day='sexta-feira';else if(/sabado|\b7a\b|\bsab\b/.test(n))day='sábado';else if(/domingo|\bdom\b/.test(n))day='domingo';let timeMatch=n.match(/\b([01]?\d|2[0-3])\s*(?:h|:|hrs?|horas?|da)\s*([0-5]\d)?\b/);let time=timeMatch?timeMatch[1].padStart(2,'0')+(timeMatch[2]?':'+timeMatch[2].padStart(2,'0'):'')+'h':null;let dateMatch=n.match(/\b(\d{1,2})\s*[\/]\s*(\d{1,2})(?:\s*[\/]\s*(\d{2,4}))?\b/);let date=dateMatch?{d:dateMatch[1].padStart(2,'0'),m:dateMatch[2].padStart(2,'0'),y:dateMatch[3]||String(new Date().getFullYear())}:null;let nextWeek=/proxima semana|semana que vem/.test(n);if(day&&nextWeek){let map={'domingo':0,'segunda-feira':1,'terça-feira':2,'quarta-feira':3,'quinta-feira':4,'sexta-feira':5,'sábado':6};let target=map[day],now=new Date(),cur=now.getDay(),delta=(target-cur+7)%7;if(delta===0)delta=7;delta+=7;let dt=new Date(now);dt.setDate(now.getDate()+delta);date={d:String(dt.getDate()).padStart(2,'0'),m:String(dt.getMonth()+1).padStart(2,'0'),y:String(dt.getFullYear())}}return{day,time,date}}function setMeeting(m){if(m.day)state.meetingDay=m.day;if(m.time)state.meetingTime=m.time;if(m.date)state.meetingDate=m.date}function meetingReady(){return !!(state.meetingDay&&state.meetingDate&&state.meetingTime&&state.meetingType)}function meetingText(){let date=state.meetingDate?state.meetingDate.d+'/'+state.meetingDate.m+'/'+state.meetingDate.y:'';return (state.meetingDay||'')+(date?' dia '+date:'')+(state.meetingTime?' às '+state.meetingTime:'')}function respond(s){let n=norm(s);if(state.step==='meeting'){if(/\bonline\b|virtual|video|remota/.test(n))state.meetingType='online';else if(/presencial|pessoalmente|visita/.test(n))state.meetingType='presencial';let m=parseMeeting(s);setMeeting(m);if(meetingReady()){state.step='confirmed';say('Perfeito, '+(state.name||'').trim()+'. Então ficou confirmado: reunião '+state.meetingType+' na '+meetingText()+'. Vou deixar esse horário alinhado para nossa conversa. Se precisar ajustar, me avisa por aqui.');return}if(!state.meetingType){say('Perfeito, '+(state.name||'').trim()+'. Você prefere fazer online ou pessoalmente?');return}if(m.day&&!m.time&&!state.meetingTime){say('Perfeito, '+(state.name||'').trim()+'. Já anotei o dia. Qual horário fica melhor para você?');return}if(m.time&&!m.day&&!state.meetingDay){say('Perfeito, '+(state.name||'').trim()+'. Já anotei o horário. Qual dia e data ficam melhores para você?');return}if(!m.day&&!m.time){say('Perfeito, '+(state.name||'').trim()+'. Qual dia e horário ficam melhores para você?');return}say('Perfeito, '+(state.name||'').trim()+'. Me passe o que estiver faltando para eu deixar a reunião confirmada.');return}if(state.step==='confirmed'||state.step==='closed')return;if(/santander|get\s*net/.test(n)){state.base=true;say('Entendi, '+(state.name||'').trim()+'. Só preciso te explicar uma coisa: hoje eu trabalho somente com captação de novos clientes. Como você já está na base que mencionou, eu não consigo atender essa operação por aqui.');state.step='closed';return}if(state.step==='name'){state.name=s.trim().split(/\s+/)[0];state.step='need';say('Prazer, '+state.name+'! Me conta, o que você está procurando hoje para sua empresa?');return}if(state.step==='need'){state.interest=/maquin|adquir|cart[aã]o|pagamento|receb/.test(n)?'maquina':/conta|banco|pj/.test(n)?'conta':'geral';state.step='turnover';say('Entendi, '+state.name+'. E hoje, quanto sua empresa fatura aproximadamente por mês?');return}if(state.step==='turnover'){let v=money(s);if(!v){say('Pode me passar uma média mesmo, '+state.name+'. Não precisa ser um valor exato.');return}state.turnover=v;state.step='current';let f=faixa(v);say(state.interest==='maquina'?'Perfeito, '+state.name+'. Então estamos falando de uma empresa '+f+'. E hoje você já usa alguma máquina ou adquirente?':state.interest==='conta'?'Entendi, '+state.name+'. Nessa faixa de faturamento já vale olhar a operação como um todo. Hoje você já possui uma conta PJ que atende bem sua empresa?':'Entendi, '+state.name+'. Nessa faixa já consigo direcionar melhor a conversa. Hoje, o que você mais gostaria de melhorar na operação da empresa?');return}if(state.step==='current'){state.step='pain';say(state.interest==='maquina'?'E o que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?':'E o que você gostaria de melhorar nessa operação hoje?');return}if(state.step==='pain'){state.step='close';say('Entendi, '+state.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, já avançar?');return}if(state.step==='close'){state.step='meeting';say('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?');return}say('Entendi, '+(state.name||'').trim()+'. Me conta um pouco mais sobre o que você procura e eu vejo como consigo te ajudar.')}function process(){let s=buffer.join(' ').trim();buffer=[];if(s)respond(s)}function sendMsg(){if(state.busy)return;let s=input.value.trim();if(!s)return;add(s,'client');input.value='';buffer.push(s);clearTimeout(debounce);typing.textContent='Luís está aguardando para entender tudo...';debounce=setTimeout(process,4500)}send.onclick=sendMsg;input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMsg()}});add('Oi! Tudo bem? Aqui é o Luís.','ai');setTimeout(()=>add('Com quem eu estou falando?','ai'),3000);</script></body></html>
