<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luís Paulo Fontes — MVP</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif}.box{max-width:700px;margin:20px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0002}header{background:#111827;color:#fff;padding:18px}header b{font-size:20px}header small{display:block;opacity:.75;margin-top:5px}.chat{height:560px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.4;white-space:pre-wrap}.ai{background:#fff;border-bottom-left-radius:5px}.client{background:#d9fdd3;margin-left:auto;border-bottom-right-radius:5px}.typing{height:25px;padding:4px 18px;background:#e9eef2;color:#667085;font-size:12px}footer{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}button{padding:0 20px;border:0;border-radius:12px;background:#111827;color:white;font-weight:700}@media(max-width:720px){.box{margin:0;border-radius:0}.chat{height:calc(100vh - 155px)}}</style></head><body><div class="box"><header><b>Luís Paulo Fontes</b><small>MVP — teste da conversa comercial</small></header><div id="chat" class="chat"></div><div id="typing" class="typing"></div><footer><input id="input" placeholder="Digite como cliente..." autocomplete="off"><button id="send">Enviar</button></footer></div><script>const chat=document.getElementById('chat'),input=document.getElementById('input'),send=document.getElementById('send'),typing=document.getElementById('typing');let state={name:null,step:'name',busy:false};function add(text,who){const d=document.createElement('div');d.className='m '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function say(text){state.busy=true;send.disabled=true;input.disabled=true;typing.textContent='Luís está digitando...';const delay=Math.min(10000,Math.max(4200,3000+text.length*45));setTimeout(()=>{typing.textContent='';add(text,'ai');state.busy=false;send.disabled=false;input.disabled=false;input.focus()},delay)}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function respond(s){const n=norm(s);if(/santander|get\s*net/.test(n)){say('Entendi, '+state.name+'. Só preciso te explicar uma coisa: hoje eu trabalho somente com captação de novos clientes. Como você já está na base que mencionou, eu não consigo atender essa operação por aqui.');state.step='closed';return}if(state.step==='name'){state.name=s.split(/\s+/)[0];state.step='need';say('Prazer, '+state.name+'! Me conta, o que você está procurando hoje para sua empresa?');return}if(state.step==='need'){state.step='turnover';say('Entendi, '+state.name+'. E hoje, quanto sua empresa fatura aproximadamente por mês?');return}if(state.step==='turnover'){state.step='pain';say('Perfeito, '+state.name+'. E hoje você já usa alguma máquina ou solução para receber pagamentos?');return}if(state.step==='pain'){state.step='close';say('Entendi. E o que você gostaria de melhorar na solução que usa hoje: taxas, suporte, prazo de recebimento ou outra coisa?');return}if(state.step==='close'){say('Faz sentido, '+state.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, você teria interesse em comparar e, se fizer sentido, avançar?');return}say('Perfeito, '+state.name+'. Podemos conversar online ou pessoalmente. Qual formato fica melhor para você?')}function sendMsg(){if(state.busy)return;const s=input.value.trim();if(!s)return;add(s,'client');input.value='';respond(s)}send.onclick=sendMsg;input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMsg()}});add('Oi! Tudo bem? Aqui é o Luís.','ai');setTimeout(()=>add('Com quem eu estou falando?','ai'),3000);</script></body></html>
