<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luís Paulo Fontes — MVP</title><style>*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif}.box{max-width:700px;margin:20px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px #0002}header{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px}header b{font-size:20px}header small{display:block;opacity:.75;margin-top:5px}.new{background:#fff;color:#111827;border:0;border-radius:9px;padding:8px 11px;font-weight:700;cursor:pointer}.chat{height:560px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai{background:#fff;border-bottom-left-radius:5px}.client{background:#d9fdd3;margin-left:auto;border-bottom-right-radius:5px}.typing{height:25px;padding:4px 18px;background:#e9eef2;color:#667085;font-size:12px}footer{display:flex;gap:8px;padding:12px;border-top:1px solid #ddd}input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}button.send{padding:0 20px;border:0;border-radius:12px;background:#111827;color:white;font-weight:700}@media(max-width:720px){.box{margin:0;border-radius:0}.chat{height:calc(100vh - 155px)}header{padding:14px}.new{font-size:12px}}
</style></head><body><div class="box"><header><div><b>Luís Paulo Fontes</b><small>MVP — teste da conversa comercial</small></div><button class="new" id="new">Novo atendimento</button></header><div id="chat" class="chat"></div><div id="typing" class="typing"></div><footer><input id="input" placeholder="Digite como cliente..." autocomplete="off"><button class="send" id="send">Enviar</button></footer></div><script>const $=id=>document.getElementById(id),chat=$('chat'),input=$('input'),send=$('send'),typing=$('typing'),newBtn=$('new'),KEY='lpf_mvp_v5';let s={name:null,step:'name',interest:null,turnover:null,bank:null,machine:null,meetingType:null,meetingDay:null,meetingDate:null,meetingTime:null};try{s={...s,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}const fresh=()=>({name:null,step:'name',interest:null,turnover:null,bank:null,machine:null,meetingType:null,meetingDay:null,meetingDate:null,meetingTime:null});const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};function add(t,c){let d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function reply(t){send.disabled=true;input.disabled=true;typing.textContent='Luís está digitando...';setTimeout(()=>{typing.textContent='';add(t,'ai');send.disabled=false;input.disabled=false;input.focus();save()},Math.min(7000,Math.max(1600,1600+t.length*22)))}function norm(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function bank(n){for(let [a,b] of [['santander','Santander'],['itau','Itaú'],['bradesco','Bradesco'],['caixa','Caixa'],['banco do brasil','Banco do Brasil'],['bb','Banco do Brasil'],['sicredi','Sicredi'],['sicoob','Sicoob'],['banrisul','Banrisul'],['inter','Inter'],['nubank','Nubank'],['c6','C6 Bank']])if(n.includes(a))return b;return null}function machine(n){for(let [a,b] of [['cielo','Cielo'],['getnet','Getnet'],['stone','Stone'],['rede','Rede'],['pagseguro','PagSeguro'],['sumup','SumUp'],['infinitepay','InfinitePay'],['safra','Safra']])if(n.includes(a))return b;return null}function money(x){let n=norm(x).replace(/\./g,'').replace(',','.');let m=n.match(/(\d+(?:\.\d+)?)\s*(mil|k|milhao|milhoes)?/);if(!m)return null;let v=+m[1];if(m[2]==='mil'||m[2]==='k')v*=1000;if(m[2]&&m[2].startsWith('milhao'))v*=1000000;return v}function faixa(v){return v>500000?'acima de R$ 500 mil':v>100000?'acima de R$ 100 mil':v>40000?'acima de R$ 40 mil':v>10000?'acima de R$ 10 mil':'até R$ 10 mil'}function meetingInfo(x){let n=norm(x),day=null;if(/segunda|\b2a\b/.test(n))day='segunda-feira';else if(/terca|\b3a\b/.test(n))day='terça-feira';else if(/quarta|\b4a\b/.test(n))day='quarta-feira';else if(/quinta|\b5a\b/.test(n))day='quinta-feira';else if(/sexta|\b6a\b/.test(n))day='sexta-feira';else if(/sabado|\b7a\b/.test(n))day='sábado';else if(/domingo/.test(n))day='domingo';let tm=n.match(/(?:\b(?:as|a|at|ate)\s*|\b)([01]?\d|2[0-3])(?:\s*(?:h|:|hrs?|horas?)\s*([0-5]\d))?\b/),time=tm?tm[1].padStart(2,'0')+(tm[2]?':'+tm[2].padStart(2,'0'):'')+'h':null,date=null,dm=n.match(/\b(\d{1,2})[\/]\s*(\d{1,2})(?:[\/]\s*(\d{2,4}))?\b/);if(dm)date={d:dm[1].padStart(2,'0'),m:dm[2].padStart(2,'0'),y:dm[3]?(dm[3].length===2?'20'+dm[3]:dm[3]):new Date().getFullYear()};if(day&&!date){let map={domingo:0,'segunda-feira':1,'terça-feira':2,'quarta-feira':3,'quinta-feira':4,'sexta-feira':5,sábado:6},d=new Date(),delta=(map[day]-d.getDay()+7)%7;if(delta===0)delta=7;if(/proxima|semana que vem/.test(n))delta+=7;d.setDate(d.getDate()+delta);date={d:String(d.getDate()).padStart(2,'0'),m:String(d.getMonth()+1).padStart(2,'0'),y:d.getFullYear()}}return{day,time,date}}function block(name){s.step='closed';save();let m='Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base '+name+'. Nesse caso, peço que direcione o atendimento para o especialista responsável pela sua conta ou procure a agência responsável pelo seu CNPJ.';if(name==='Santander')m+='\n\nCentral Santander Empresas: 4004-2125.';if(name==='Getnet')m+='\n\nCentral Getnet: 4002-4000.';reply(m)}function respond(raw){let n=norm(raw);if(s.step==='name'){s.name=raw.trim().split(/\s+/)[0];s.step='interest';save();reply('Prazer, '+s.name+'! Me conta, o que você está procurando hoje para sua empresa?');return}if(s.step==='interest'){s.interest=/conta|banco|pj/.test(n)?'conta':'maquina';s.step='account';save();reply('Entendi, '+s.name+'. Hoje você já possui uma conta PJ? Se sim, qual banco você utiliza?');return}if(s.step==='account'){let b=bank(n),m=machine(n);if(n.includes('santander')||n.includes('getnet')){block(n.includes('santander')?'Santander':'Getnet');return}if(b)s.bank=b;if(m)s.machine=m;if(/\bnao\b|não tenho|nao tenho|nenhuma/.test(n)){s.step='turnover';save();reply('Entendi, '+s.name+'. E quanto sua empresa fatura aproximadamente por mês?');return}if(b&&m){s.step='turnover';save();reply('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+' e a '+m+'. Quanto sua empresa fatura aproximadamente por mês?');return}if(b){s.step='machine';save();reply('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?');return}reply('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?');return}if(s.step==='machine'){let m=machine(n);if(n.includes('santander')||n.includes('getnet')){block(n.includes('santander')?'Santander':'Getnet');return}if(m)s.machine=m;s.step='turnover';save();reply('Perfeito, '+s.name+'. Quanto sua empresa fatura aproximadamente por mês?');return}if(s.step==='turnover'){let v=money(raw);if(!v){reply('Pode me passar uma média mesmo, '+s.name+'. Não precisa ser exato.');return}s.turnover=v;s.step='pain';save();reply('Perfeito, '+s.name+'. Então estamos falando de uma empresa '+faixa(v)+'. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?');return}if(s.step==='pain'){s.step='advance';save();reply('Entendi, '+s.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, já avançar?');return}if(s.step==='advance'){s.step='meeting';save();reply('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?');return}if(s.step==='meeting'){if(/online|on\s+line|virtual|video|remota/.test(n))s.meetingType='online';else if(/presencial|pessoalmente|visita/.test(n))s.meetingType='presencial';let x=meetingInfo(raw);if(x.day)s.meetingDay=x.day;if(x.time)s.meetingTime=x.time;if(x.date)s.meetingDate=x.date;if(s.meetingType&&s.meetingDay&&s.meetingTime){s.step='confirmed';save();reply('Perfeito, '+s.name+'. Reunião confirmada: '+s.meetingType+', '+s.meetingDay+', dia '+s.meetingDate.d+'/'+s.meetingDate.m+'/'+s.meetingDate.y+' às '+s.meetingTime+'. Até lá!');return}if(!s.meetingType){reply('Perfeito, '+s.name+'. Você prefere fazer online ou pessoalmente?');return}reply('Perfeito, '+s.name+'. Qual dia e horário ficam melhores para você?');return}if(s.step==='confirmed'){if(/^(ok|okay|ta|tá|ate|até|ate la|até lá|obrigad[oa]|perfeito|combinado|valeu)/.test(n))reply('Perfeito, '+s.name+'. Até lá! 👋');else reply('Claro, '+s.name+'. Como posso te ajudar?');return}if(s.step==='closed')return}function startFresh(){localStorage.removeItem(KEY);s=fresh();chat.innerHTML='';typing.textContent='';send.disabled=false;input.disabled=false;add('Oi! Tudo bem? Aqui é o Luís.','ai');setTimeout(()=>add('Com quem eu estou falando?','ai'),3000);save();input.focus()}function sendMsg(){if(send.disabled)return;let x=input.value.trim();if(!x)return;add(x,'client');input.value='';typing.textContent='Luís está aguardando para entender tudo...';setTimeout(()=>respond(x),1000)}newBtn.onclick=startFresh;send.onclick=sendMsg;input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMsg()}});if(s.name){add('Olá novamente, '+s.name+'! Que bom falar com você novamente.','ai');setTimeout(()=>add('Como posso te ajudar hoje?','ai'),1800)}else{add('Oi! Tudo bem? Aqui é o Luís.','ai');setTimeout(()=>add('Com quem eu estou falando?','ai'),3000)}save();</script></body></html>
