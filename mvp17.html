<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luís Paulo Fontes — MVP v28</title><style>body{font-family:Arial;margin:0;background:#eef1f4}.box{max-width:700px;margin:20px auto;background:white;border-radius:16px;overflow:hidden}.h{background:#111827;color:white;padding:18px;display:flex;justify-content:space-between}.chat{height:520px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai{background:white}.u{background:#d9fdd3;margin-left:auto}.f{display:flex;gap:8px;padding:12px}.f input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}.f button,.h button{padding:10px 15px;border:0;border-radius:10px;background:#111827;color:white;font-weight:bold}.h button{background:white;color:#111827}.ops{display:none;padding:10px 12px;background:#fff7ed;border-top:1px solid #f0d8bd}.ops b{display:block;margin-bottom:7px}.ops button{padding:9px 13px;margin-right:7px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.yes{background:#dcfce7}.no{background:#fee2e2}</style><div class="box"><div class="h"><b>Luís Paulo Fontes<br><small>MVP — teste da conversa comercial v28</small></b><button onclick="novo()">Novo atendimento</button></div><div id="c" class="chat"></div><div id="ops" class="ops"><b>Controle interno — não aparece para o cliente</b><button class="yes" onclick="disp(true)">Produto disponível</button><button class="no" onclick="disp(false)">Produto indisponível</button></div><div class="f"><input id="i" placeholder="Digite como cliente..."><button onclick="enviar()">Enviar</button></div></div><script>let s={step:'name',name:'',cnpj:'',bank:'',machine:'',turnover:0};const c=document.getElementById('c'),i=document.getElementById('i'),ops=document.getElementById('ops');function add(t,u=false){c.innerHTML+='<div class="m '+(u?'u':'ai')+'">'+t+'</div>';c.scrollTop=c.scrollHeight}function novo(){s={step:'name',name:'',cnpj:'',bank:'',machine:'',turnover:0};c.innerHTML='';ops.style.display='none';add('Oi! Tudo bem? Aqui é o Luís.');setTimeout(()=>add('Com quem eu estou falando?'),1200)}function n(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}function enviar(){let x=i.value.trim();if(!x)return;add(x,true);i.value='';setTimeout(()=>r(x),500)}function disp(ok){ops.style.display='none';if(ok){s.step='account';add('Perfeito, '+s.name+'. Vamos continuar. Hoje você já possui uma conta PJ? Se sim, qual banco você utiliza?')}else{add('Entendi, '+s.name+'. No momento não temos uma solução disponível para este CNPJ. Agradeço pelo seu contato e podemos avaliar novamente caso a disponibilidade mude.');s.step='closed'}}function banco(q){if(q.includes('santander'))return'Santander';if(q.includes('itau'))return'Itaú';if(q.includes('bradesco'))return'Bradesco';if(q.includes('caixa'))return'Caixa';if(q.includes('banrisul'))return'Banrisul';if(q.includes('sicredi'))return'Sicredi';if(q.includes('sicoob'))return'Sicoob';if(q.includes('inter'))return'Inter';if(q.includes('nubank'))return'Nubank';if(q.includes('banco do brasil')||q.includes(' bb'))return'Banco do Brasil';if(q.includes('pagseguro')||q.includes('pagbank'))return'PagBank';return null}function maquina(q){if(q.includes('stone'))return'Stone';if(q.includes('cielo'))return'Cielo';if(q.includes('getnet'))return'Getnet';if(q.includes('rede'))return'Rede';if(q.includes('pagseguro')||q.includes('pagbank'))return'PagSeguro';if(q.includes('sumup'))return'SumUp';return null}function r(x){let q=n(x);if(s.step==='name'){let p=x.trim().split(/\s+/);s.name=p[0]||x.trim();s.step='interest';add('Prazer, '+s.name+'! Me conta, o que você está procurando hoje para sua empresa?');return}if(s.step==='interest'){s.step='cnpj';add('Perfeito, '+s.name+'. Para eu verificar a disponibilidade das soluções para sua empresa, me informe o CNPJ, por favor.');return}if(s.step==='cnpj'){let d=x.replace(/\D/g,'');if(d.length<11){add('Pode me informar o CNPJ completo, por favor?');return}s.cnpj=d;s.step='availability';ops.style.display='block';return}if(s.step==='availability'){return}if(s.step==='account'){if(q.includes('santander')){if(/\bpf\b|pessoa fisica/.test(q)){s.step='machine';add('Perfeito, '+s.name+'. Entendi que sua conta Santander é pessoa física. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}else{add('Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base Santander. Nesse caso, peço que direcione o atendimento para o especialista responsável pela sua conta ou procure a agência responsável pelo seu CNPJ.');s.step='closed'}return}if(/\bnao\b|não tenho/.test(q)){s.step='turnover';add('Entendi, '+s.name+'. E quanto sua empresa fatura aproximadamente por mês?');return}let b=banco(q),m=maquina(q);if(b)s.bank=b;if(m)s.machine=m;if(b&&m){s.step='turnover';add('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+' e a '+m+'. Quanto sua empresa fatura aproximadamente por mês?');return}if(b){s.step='machine';add('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?');return}if(m&&(/conta/.test(q)||/banco/.test(q))){s.bank=m==='PagSeguro'?'PagBank':null;s.step='turnover';add('Perfeito, '+s.name+'. Entendi que você utiliza o '+(s.bank||m)+' e a '+m+'. Quanto sua empresa fatura aproximadamente por mês?');return}add('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?');return}if(s.step==='machine'){let m=maquina(q);if(m)s.machine=m;s.step='turnover';add('Perfeito, '+s.name+'. Quanto sua empresa fatura aproximadamente por mês?');return}if(s.step==='turnover'){let raw=q.replace(/\./g,'').replace(',','.');let v=parseFloat(raw.replace(/[^0-9.]/g,''));if(/\bmil\b|\bml\b/.test(q))v*=1000;if(!v){add('Pode me passar uma média mesmo, '+s.name+'. Não precisa ser exato.');return}s.turnover=v;s.step='pain';add('Perfeito, '+s.name+'. Então estamos falando de uma empresa '+(v>40000?'acima de R$ 40 mil':'até R$ 40 mil')+'. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?');return}if(s.step==='pain'){s.step='advance';add('Entendi, '+s.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, já avançar?');return}if(s.step==='advance'){s.step='meeting';add('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?');return}if(s.step==='meeting'){if(/online|virtual|remota/.test(q))s.meeting='online';else if(/presencial|pessoalmente/.test(q))s.meeting='presencial';let tomorrow=/\bamanha\b/.test(q),dayMatch=q.match(/segunda|terca|quarta|quinta|sexta|sabado|domingo/);if(tomorrow)s.day='amanhã';else if(dayMatch)s.day=dayMatch[0];let timeMatch=q.match(/\b(?:as|às|a)?\s*([01]?\d|2[0-3])\s*(?:h|horas)?\b/);if(timeMatch)s.time=timeMatch[1].padStart(2,'0')+'h';if(s.meeting&&s.day&&s.time){s.step='confirmed';add('Perfeito, '+s.name+'. Reunião confirmada: '+s.meeting+', '+s.day+' às '+s.time+'. Até lá!')}else if(s.meeting)add('Perfeito, '+s.name+'. Qual dia e horário ficam melhores para você?');else add('Perfeito, '+s.name+'. Você prefere fazer online ou pessoalmente?');return}if(s.step==='confirmed')add('Perfeito, '+s.name+'. Até lá! 👋')}function start(){novo()}start();i.addEventListener('keydown',e=>{if(e.key==='Enter')enviar()})</script>
