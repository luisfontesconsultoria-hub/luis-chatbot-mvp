<!doctype html><html lang='pt-BR'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Luís Paulo Fontes — MVP v45</title><style>body{font-family:Arial,sans-serif;margin:0;background:#eef1f4}.box{max-width:700px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden}.h{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between}.chat{height:520px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45}.ai{background:#fff}.u{background:#d9fdd3;margin-left:auto}.typing{font-size:13px;color:#667085;padding:6px 18px;font-style:italic}.f{display:flex;gap:8px;padding:12px}.f input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}.f button,.h button{padding:10px 15px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:bold}.h button{background:#fff;color:#111827}</style></head><body><div class='box'><div class='h'><b>Luís Paulo Fontes<br><small>MVP — revisão v45</small></b><button onclick='novo()'>Novo atendimento</button></div><div id='c' class='chat'></div><div id='typing' class='typing'></div><div class='f'><input id='i' placeholder='Digite como cliente...'><button onclick='env()'>Enviar</button></div></div><script>let s={p:'name',name:''},c=document.getElementById('c'),i=document.getElementById('i'),ty=document.getElementById('typing');const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();function add(t,u){c.innerHTML+='<div class="m '+(u?'u':'ai')+'">'+t+'</div>';c.scrollTop=c.scrollHeight}function rep(t,cb){ty.textContent='digitando...';setTimeout(()=>{ty.textContent='';add(t);if(cb)cb()},700)}function novo(){s={p:'name',name:''};c.innerHTML='';add('Oi! Tudo bem? Aqui é o Luís.');setTimeout(()=>add('Com quem eu estou falando?'),450)}function env(){let x=i.value.trim();if(!x)return;add(x,1);i.value='';setTimeout(()=>go(x),220)}const banks=[['banco do brasil','Banco do Brasil'],['bb','Banco do Brasil'],['banrisul','Banrisul'],['santander','Santander'],['itau','Itaú'],['itaú','Itaú'],['bradesco','Bradesco'],['caixa','Caixa'],['sicredi','Sicredi'],['sicoob','Sicoob'],['nubank','Nubank'],['nu bank','Nubank'],['cora','Cora'],['picpay','PicPay'],['pic pay','PicPay'],['c6 bank','C6 Bank'],['c6','C6 Bank'],['mercado pago','Mercado Pago'],['mercadopago','Mercado Pago'],['pagbank','PagBank'],['pagseguro','PagBank'],['inter','Inter'],['banco inter','Inter'],['original','Banco Original'],['btg','BTG Pactual'],['safra','Safra'],['daycoval','Daycoval'],['neon','Neon'],['next','Next'],['banco pan','Banco PAN'],['pan','Banco PAN'],['bmg','BMG'],['xp','XP'],['iti','iti']];const machines=[['stone','Stone'],['cielo','Cielo'],['getnet','Getnet'],['rede','Rede'],['pagseguro','PagSeguro'],['pagbank','PagBank'],['mercado pago','Mercado Pago'],['sumup','SumUp']];function find(q,a){for(const [k,v] of a)if(q.includes(k))return v;return null}const extraWords=/\b(credito|creditos|financiamento|financiamentos|consorcio|consorcios|cheque|cheques|emprestimo|emprestimos|capital de giro|antecipacao|antecipacoes|limite|limites)\b/;function isExtra(q){return extraWords.test(q)}function money(q){let x=norm(q).replace(/r\$|reais|real/g,' '),m=x.match(/([0-9]+(?:[.,][0-9]+)?)\s*(milhoes?|milhao|mil|k|m|mi)\b/);if(m){let v=parseFloat(m[1].replace(',','.'));return /milhao|milhoes|mi|^m$/.test(m[2])?v*1000000:v*1000}let n=x.match(/\d[\d.]*(?:,\d+)?/);if(!n)return 0;let z=n[0];if(z.includes(',')&&z.includes('.'))z=z.replace(/\./g,'').replace(',','.');else if(z.includes(','))z=z.replace(',','.');else if(/\.\d{3}$/.test(z))z=z.replace('.','');return parseFloat(z)||0}function faixa(v){if(v<=10000)return'até R$ 10 mil';if(v<=40000)return'acima de R$ 10 mil e até R$ 40 mil';if(v<=100000)return'acima de R$ 40 mil e até R$ 100 mil';return'acima de R$ 100 mil'}function time(q){let m=q.match(/\b(\d{1,2})(?:[:h.]?(\d{2}))?\s*(h|hrs|horas|da manha|da tarde|da noite)?\b/);if(!m)return null;let h=+m[1],mi=m[2]?+m[2]:0,p=m[3]||'';if(/tarde|noite/.test(p)&&h<12)h+=12;if(h>23)return null;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0')}function day(q){let now=new Date();if(/\bamanha\b/.test(q)){let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);return['amanhã',d]}let names=[['domingo','domingo'],['segunda','segunda'],['terca','terça'],['quarta','quarta'],['quinta','quinta'],['sexta','sexta'],['sabado','sábado']];for(const [k,l] of names)if(new RegExp('\\b'+k+'(?:-feira)?\\b').test(q)){let t=['domingo','segunda','terça','quarta','quinta','sexta','sábado'].indexOf(l),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),n=(t-d.getDay()+7)%7;if(!n)n=7;d.setDate(d.getDate()+n);return[l,d]}let sh=q.match(/\b([2-7])a\b/);if(sh){let l={2:'segunda',3:'terça',4:'quarta',5:'quinta',6:'sexta',7:'sábado'}[sh[1]],t=['domingo','segunda','terça','quarta','quinta','sexta','sábado'].indexOf(l),d=new Date(now.getFullYear(),now.getMonth(),now.getDate()),n=(t-d.getDay()+7)%7;if(!n)n=7;d.setDate(d.getDate()+n);return[l,d]}return null}function df(d){return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}function agenda(q){if(/online|virtual|remota|video/.test(q))s.mode='online';if(/presencial|pessoalmente|visita/.test(q))s.mode='presencial';let t=time(q),d=day(q);if(t)s.time=t;if(d){s.day=d[0];s.date=df(d[1])}if(s.mode&&s.day&&s.time){s.p='confirmed';return rep('Perfeito, '+s.name+'. Reunião confirmada: '+s.mode+', '+s.day+', dia '+s.date+' às '+s.time.replace(':','h')+'. Até lá!')}return rep(s.mode?'Perfeito, '+s.name+'. Qual dia e horário ficam melhores para você?':'Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?')}function extraFlow(){s.p='cnpj';return rep('Entendi, '+s.name+'. Crédito, financiamento, consórcio, cheque e outros produtos desse tipo dependem de análise do banco e podem ser avaliados posteriormente, depois da abertura da conta. Primeiro vamos verificar se existe disponibilidade de conta ou máquina para sua empresa. Para fazer essa verificação, me informe o CNPJ, por favor.')}function checkAvailability(){s.p='availability';return rep('Perfeito, '+s.name+'. Recebi o CNPJ. Agora vou verificar a disponibilidade de conta e máquina para sua empresa.',()=>setTimeout(()=>{s.avail=true;s.p='account';rep('Pronto, '+s.name.+' A consulta inicial foi realizada. Vamos continuar: hoje você já possui uma conta PJ? Se sim, qual banco ou instituição financeira você utiliza?')},900))}function go(x){let q=norm(x);if(s.p==='name'){s.name=x.trim().split(/\s+/)[0]||x;s.p='interest';return rep('Prazer, '+s.name+'! Me conta, o que você está procurando hoje para sua empresa?')}if(s.p==='interest'){if(isExtra(q))return extraFlow();s.p='cnpj';return rep('Perfeito, '+s.name+'. Para eu verificar a disponibilidade das soluções para sua empresa, me informe o CNPJ, por favor.')}if(s.p==='cnpj'){if(x.replace(/\D/g,'').length<11)return rep('Pode me informar o CNPJ completo, por favor?');s.cnpj=x;return checkAvailability()}if(s.p==='availability')return rep('Só um instante, estou verificando para você.');if(s.p==='account'){let b=find(q,banks),m=find(q,machines);if(b){s.bank=b;s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(/^sim\b|^tenho\b|^possuo\b/.test(q)){s.p='bank';return rep('Perfeito, '+s.name+'. Qual banco ou instituição financeira você utiliza atualmente na sua conta PJ?')}if(/^nao\b|^não\b|nao tenho|ainda nao/.test(q)){s.p='turnover';return rep('Entendi, '+s.name+'. E quanto sua empresa fatura aproximadamente por mês?')}s.bank=x.trim();s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que você utiliza a '+x.trim()+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(s.p==='bank'){let b=find(q,banks);s.bank=b||x.trim();s.p='machine';return rep('Perfeito, '+s.name+'. Entendi. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(s.p==='machine'){s.machine=find(q,machines)||x;s.p='turnover';return rep('Perfeito, '+s.name+'. Quanto sua empresa fatura aproximadamente por mês?')}if(s.p==='turnover'){let v=money(q);if(!v)return rep('Pode me passar uma média mesmo, '+s.name+'. Não precisa ser exato.');s.faturamento=v;s.p='pain';return rep('Perfeito, '+s.name+'. Então estamos falando de uma empresa '+faixa(v)+'. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?')}if(s.p==='pain'){s.p='advance';return rep('Entendi, '+s.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, avançar?')}if(s.p==='advance'){s.p='meeting';return rep('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?')}if(s.p==='meeting')return agenda(q);if(s.p==='confirmed'&&/^(ate|ate la|ok ate|blz|beleza|ate logo|ate breve|ate mais|tchau|valeu|obrigado|obrigada)[.!?\s]*$/i.test(q))return add('👍',0)}novo();i.addEventListener('keydown',e=>{if(e.key==='Enter')env()})</script></body></html>
