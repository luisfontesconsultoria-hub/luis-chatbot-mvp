<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captação</title><style>body{font-family:system-ui,sans-serif;margin:24px;max-width:1200px}input,select,button{padding:9px;margin:4px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left}.actions{white-space:nowrap}</style></head><body><h1>Captação</h1><p>Empresas captadas ficam separadas do CRM até ativação manual.</p><input id="q" placeholder="Pesquisar empresa, telefone, cidade..."><select id="status"><option value="">Todos</option><option value="CAPTURED">Captadas</option><option value="ACTIVATED">Ativadas</option></select><button onclick="load()">Atualizar</button><table><thead><tr><th>Empresa</th><th>Telefone</th><th>Cidade/UF</th><th>Fonte</th><th>Status</th><th>Ação</th></tr></thead><tbody id="rows"></tbody></table><script>const token=localStorage.getItem('crm_token')||localStorage.getItem('token')||'';async function load(){const qs=new URLSearchParams({limit:'500'});if(document.querySelector('#status').value)qs.set('status',document.querySelector('#status').value);const r=await fetch('/api/captacao/companies?'+qs,{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok){alert(d.error||'Erro');return}const q=document.querySelector('#q').value.toLowerCase();document.querySelector('#rows').innerHTML=(d.companies||[]).filter(c=>!q||[c.name,c.phone,c.cnpj,c.address,c.city,c.state,c.segment,c.email].join(' ').toLowerCase().includes(q)).map(c=>'<tr><td>'+esc(c.name)+'</td><td>'+esc(c.phone)+'</td><td>'+esc((c.city||'')+(c.state?' / '+c.state:''))+'</td><td>'+esc(c.source||'')+'</td><td>'+esc(c.status||'')+'</td><td class="actions">'+(c.status==='CAPTURED'&&!c.lead_id?'<button onclick="activate(\''+c.id+'\')">Ativar para prospecção</button>':'—')+'</td></tr>').join('')}async function activate(id){if(!confirm('Ativar esta empresa para prospecção e vinculá-la ao CRM?'))return;const r=await fetch('/api/captacao/companies/activate',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({companyId:id})});const d=await r.json();if(!r.ok){alert(d.error||'Não foi possível ativar');return}alert('Empresa ativada no CRM. Lead: '+d.lead.id);load()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
