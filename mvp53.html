<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luís Paulo Fontes — MVP v53</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eef1f4}.box{max-width:700px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}.h{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center}.chat{height:520px;overflow:auto;padding:18px;background:#e9eef2}.m,.result{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45;white-space:pre-wrap}.ai,.result{background:#fff}.u{background:#d9fdd3;margin-left:auto}.result{border:1px solid #d9dee5}.small{font-size:13px;color:#667085}.typing{font-size:13px;color:#667085;padding:6px 18px;font-style:italic}.f{display:flex;gap:8px;padding:12px}.f input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}.f button,.h button{padding:10px 15px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:bold;cursor:pointer}.h button{background:#fff;color:#111827}.status{padding:8px 18px;font-size:12px;color:#667085;background:#f8fafc;border-top:1px solid #eef1f4}
</style>
</head>
<body>
<div class="box">
  <div class="h"><b>Luís Paulo Fontes<br><small>MVP — revisão v53</small></b><button onclick="novo()">Novo atendimento</button></div>
  <div id="c" class="chat" aria-live="polite"></div>
  <div id="t" class="typing"></div>
  <div id="status" class="status"></div>
  <div class="small" style="padding:8px 18px">MVP de teste. A etapa AGUARDANDO_RETORNO_DO_LUIS bloqueia avanço comercial automático. Para simular o retorno do consultor, digite <b>produto:sim</b> ou <b>produto:nao</b>.</div>
  <div class="f"><input id="i" autocomplete="off" placeholder="Digite como cliente..." aria-label="Mensagem"><button onclick="env()">Enviar</button></div>
</div>
<script>
const initialState=()=>({p:"name",name:"",cnpj:"",product:null,bank:"",machine:"",faturamento:"",pain:"",consent:false});
let s=initialState();
const c=document.getElementById("c"),i=document.getElementById("i"),t=document.getElementById("t"),statusEl=document.getElementById("status");
const norm=x=>String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
function add(text,user=false){const el=document.createElement("div");el.className="m "+(user?"u":"ai");el.textContent=String(text);c.appendChild(el);c.scrollTop=c.scrollHeight}
function result(text){const el=document.createElement("div");el.className="result";el.textContent=String(text);c.appendChild(el);c.scrollTop=c.scrollHeight}
function say(text){t.textContent="digitando...";setTimeout(()=>{t.textContent="";add(text)},450)}
function setStatus(){statusEl.textContent="Estado: "+s.p+(s.p==="waiting_operator"?" — atendimento bloqueado até retorno do Luís":"")}
function novo(){s=initialState();c.innerHTML="";add("Oi! Tudo bem? Aqui é o Luís.");setTimeout(()=>{add("Com quem eu estou falando?");setStatus()},350);setStatus()}
function env(){const x=i.value.trim();if(!x)return;add(x,true);i.value="";setTimeout(()=>go(x),120)}
const bancos=[["bb","Banco do Brasil"],["banco do brasil","Banco do Brasil"],["banrisul","Banrisul"],["bradesco","Bradesco"],["cora","Cora"],["nubank","Nubank"],["c6","C6 Bank"],["mercado pago","Mercado Pago"],["picpay","PicPay"],["inter","Inter"],["sicredi","Sicredi"],["sicoob","Sicoob"],["caixa","Caixa"],["itau","Itaú"],["santander","Santander"]];
const extras=/\b(credito|creditario|crediario|financiamento|consorcio|cheque|emprestimo|capital de giro|antecipacao|limite|cartao de credito|cartao credito|parcelamento|refinanciamento|investimento|seguro)\b/;
function banco(q){for(const x of bancos)if(q.includes(x[0]))return x[1];return null}
function formatCNPJ(d){return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,"$1.$2.$3/$4-$5")}
function validCNPJ(value){const d=String(value).replace(/\D/g,"");if(d.length!==14||/^([0-9])\1{13}$/.test(d))return false;let calc=(base,weights)=>{let sum=0;for(let j=0;j<weights.length;j++)sum+=Number(base[j])*weights[j];let r=sum%11;return r<2?0:11-r};return calc(d.slice(0,12),[5,4,3,2,9,8,7,6,5,4,3,2])===Number(d[12])&&calc(d.slice(0,13),[6,5,4,3,2,9,8,7,6,5,4,3,2])===Number(d[13])}
function waiting(){return say("Recebi sua mensagem. Neste momento seu atendimento está aguardando o retorno do Luís. Assim que ele retornar, continuamos por aqui.")}
function go(x){const q=norm(x);
  if(s.p==="waiting_operator"){
    if(q==="produto:sim"||q==="produto sim"){s.product=true;s.p="account";result("Consulta realizada pelo consultor: há produto disponível para a empresa.");say("Pronto, "+s.name+". A consulta foi realizada e temos produto disponível para sua empresa. Vamos continuar: hoje você já possui uma conta PJ? Se sim, qual banco ou instituição financeira você utiliza?");setStatus();return}
    if(q==="produto:nao"||q==="produto nao"){s.product=false;s.p="done";result("Consulta realizada pelo consultor: no momento não há produto disponível para seguir por este atendimento.");say("Entendi, "+s.name+". Neste momento não temos uma solução disponível para seguir por aqui. Obrigado pelo seu contato.");setStatus();return}
    waiting();setStatus();return;
  }
  if(s.p==="name"){s.name=x.split(/\s+/)[0]||x;s.p="interest";say("Prazer, "+s.name+"! Me conta, o que você está procurando hoje para sua empresa?");setStatus();return}
  if(s.p==="interest"){s.p="cnpj";if(extras.test(q)){say("Entendi, "+s.name+". Esse produto pode ser avaliado posteriormente, mas depende de análise do banco e somente depois da abertura da conta, junto com o gerente responsável pela sua conta. Neste primeiro momento, vamos verificar apenas a disponibilidade de conta PJ ou máquina para sua empresa. Me informe o CNPJ, por favor.")}else say("Perfeito, "+s.name+". Para eu verificar a disponibilidade de conta PJ ou máquina para sua empresa, me informe o CNPJ, por favor. Ex.: 12.345.678/0001-09");setStatus();return}
  if(s.p==="cnpj"){const d=x.replace(/\D/g,"");if(!validCNPJ(d))return say("O CNPJ informado parece inválido. Pode conferir os 14 dígitos e enviar novamente? Ex.: 12.345.678/0001-09");s.cnpj=d;s.p="waiting_operator";say("Perfeito, "+s.name+". Recebi o CNPJ "+formatCNPJ(d)+". Vou verificar apenas a disponibilidade de conta PJ ou máquina para sua empresa. Só um instante, por favor.");setStatus();return}
  if(extras.test(q)&&!/^produto:/.test(q)){s.p="cnpj";say("Entendi, "+s.name+". Esse produto depende de análise do banco e somente pode ser avaliado posteriormente. Neste primeiro momento, vamos verificar apenas a disponibilidade de conta PJ ou máquina para sua empresa. Me informe o CNPJ, por favor.");setStatus();return}
  if(s.p==="account"){const b=banco(q);if(b){s.bank=b;s.p="machine";say("Perfeito, "+s.name+". Entendi que você utiliza o "+b+". E hoje você também utiliza alguma máquina de cartão? Se sim, qual?")}else if(/^(sim|tenho|possuo)\b/.test(q)){s.p="bank";say("Perfeito, "+s.name+". Qual banco ou instituição financeira você utiliza atualmente na sua conta PJ?")}else{s.bank=x;s.p="machine";say("Entendi, "+s.name+". E hoje você também utiliza alguma máquina de cartão? Se sim, qual?")}setStatus();return}
  if(s.p==="bank"){s.bank=banco(q)||x;s.p="machine";say("Perfeito, "+s.name+". Entendi. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?");setStatus();return}
  if(s.p==="machine"){s.machine=x;s.p="turnover";say("Perfeito, "+s.name+". Quanto sua empresa fatura aproximadamente por mês?");setStatus();return}
  if(s.p==="turnover"){s.faturamento=x;s.p="pain";say("Perfeito, "+s.name+". Entendi. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?");setStatus();return}
  if(s.p==="pain"){s.p="meeting";s.pain=x;say("Entendi. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar?");setStatus();return}
  if(s.p==="meeting"){s.p="done";say("Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?");setStatus();return}
  if(s.p==="done")add("👍");setStatus();
}
novo();i.addEventListener("keydown",e=>{if(e.key==="Enter")env()});
</script>
</body>
</html>
