<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luís Paulo Fontes — MVP v38</title><style>body{font-family:Arial;margin:0;background:#eef1f4}.box{max-width:700px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden}.h{background:#111827;color:#fff;padding:18px;display:flex;justify-content:space-between}.chat{height:520px;overflow:auto;padding:18px;background:#e9eef2}.m{max-width:82%;padding:12px 15px;margin:9px 0;border-radius:17px;line-height:1.45}.ai{background:#fff}.u{background:#d9fdd3;margin-left:auto}.typing{font-size:13px;color:#667085;padding:0 18px 8px;font-style:italic}.f{display:flex;gap:8px;padding:12px}.f input{flex:1;padding:14px;border:1px solid #ccd3da;border-radius:12px;font-size:16px}.f button,.h button{padding:10px 15px;border:0;border-radius:10px;background:#111827;color:#fff;font-weight:bold}.h button{background:#fff;color:#111827}.ops{display:none;padding:10px 12px;background:#fff7ed}.ops button{padding:9px 13px;margin-right:7px;border:0;border-radius:8px;font-weight:bold}.yes{background:#dcfce7}.no{background:#fee2e2}</style><div class="box"><div class="h"><b>Luís Paulo Fontes<br><small>MVP — revisão v38</small></b><button onclick="novo()">Novo atendimento</button></div><div id="c" class="chat"></div><div id="typing" class="typing"></div><div id="ops" class="ops"><b>Controle interno — não aparece para o cliente</b><button class="yes" onclick="disp(1)">Produto disponível</button><button class="no" onclick="disp(0)">Produto indisponível</button></div><div class="f"><input id="i" placeholder="Digite como cliente..."><button onclick="env()">Enviar</button></div></div><script>let s={p:'name'},c=document.getElementById('c'),i=document.getElementById('i'),ops=document.getElementById('ops'),ty=document.getElementById('typing');const norm=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');function add(t,u){c.innerHTML+='<div class="m '+(u?'u':'ai')+'">'+t+'</div>';c.scrollTop=c.scrollHeight}function rep(t){ty.textContent='digitando...';setTimeout(()=>{ty.textContent='';add(t)},650+Math.min(t.length*5,500))}function novo(){s={p:'name'};c.innerHTML='';ops.style.display='none';add('Oi! Tudo bem? Aqui é o Luís.');setTimeout(()=>add('Com quem eu estou falando?'),500)}function env(){let x=i.value.trim();if(!x)return;add(x,1);i.value='';setTimeout(()=>go(x),250)}function disp(ok){ops.style.display='none';if(ok){s.p='account';rep('Perfeito, '+s.name+'. Vamos continuar. Hoje você já possui uma conta PJ? Se sim, qual banco você utiliza?')}else{s.p='closed';rep('Entendi, '+s.name+'. No momento não temos uma solução disponível para este CNPJ. Agradeço pelo contato.')}}function bank(q){let a=[['banco do brasil','Banco do Brasil'],['santander','Santander'],['itau','Itaú'],['bradesco','Bradesco'],['caixa','Caixa'],['banrisul','Banrisul'],['sicredi','Sicredi'],['sicoob','Sicoob'],['nubank','Nubank'],['picpay','PicPay'],['pic pay','PicPay'],['c6','C6 Bank'],['mercado pago','Mercado Pago'],['mercadopago','Mercado Pago'],['pagseguro','PagBank'],['pagbank','PagBank'],['original','Banco Original'],['btg','BTG Pactual'],['safra','Safra'],['daycoval','Daycoval'],['neon','Neon'],['next','Next'],['pan','Banco PAN'],['bmg','BMG'],['xp','XP'],['iti','iti'],['inter','Inter']];for(let [a1,b] of a)if(q.includes(a1))return b;return null}function machine(q){let a=[['stone','Stone'],['cielo','Cielo'],['getnet','Getnet'],['rede','Rede'],['pagseguro','PagSeguro'],['pagbank','PagSeguro'],['mercado pago','Mercado Pago'],['mercadopago','Mercado Pago'],['sumup','SumUp']];for(let [a1,b] of a)if(q.includes(a1))return b;return null}function hasM(q){return /maquin|maquinh|cartao|cartão|pos\b/.test(q)}function money(q){let x=norm(q).replace(/r\$|reais|real/g,' ').trim();let m=x.match(/([0-9]+(?:[.,][0-9]+)?)\s*(milhao|milhoes|mi|m|mil|ml|k)\b/);if(m){let v=parseFloat(m[1].replace(',','.'));let u=m[2];if(['milhao','milhoes','mi','m'].includes(u))return v*1000000;return v*1000}let nums=x.match(/\d[\d.]*(?:,\d+)?/);if(!nums)return 0;let z=nums[0];if(z.includes(',')&&z.includes('.'))z=z.replace(/\./g,'').replace(',','.');else if(z.includes(','))z=z.replace(',','.');else if((z.match(/\./g)||[]).length>1)z=z.replace(/\./g,'');else if(/\.\d{3}$/.test(z))z=z.replace('.','');return parseFloat(z)||0}function faixa(v){return v>100000?'acima de R$ 100 mil':v>40000?'acima de R$ 40 mil':v>10000?'acima de R$ 10 mil':'até R$ 10 mil'}function go(x){let q=norm(x);if(s.p==='name'){s.name=x.trim().split(/\s+/)[0]||x;s.p='interest';return rep('Prazer, '+s.name+'! Me conta, o que você está procurando hoje para sua empresa?')}if(s.p==='interest'){s.p='cnpj';return rep('Perfeito, '+s.name+'. Para eu verificar a disponibilidade das soluções para sua empresa, me informe o CNPJ, por favor.')}if(s.p==='cnpj'){if(x.replace(/\D/g,'').length<11)return rep('Pode me informar o CNPJ completo, por favor?');s.p='availability';ops.style.display='block';return}if(s.p==='availability')return;if(s.p==='account'){let b=bank(q),m=machine(q);if(b==='Santander'){if(/\bpf\b|pessoa fisica/.test(q)){s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que sua conta Santander é pessoa física. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}s.p='closed';return rep('Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base Santander. Nesse caso, peço que procure o especialista responsável pela sua conta ou a agência responsável pelo seu CNPJ.')}if(b){s.bank=b;if(hasM(q)){s.machine=m||b;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi que você utiliza conta e máquina do '+b+'. Quanto sua empresa fatura aproximadamente por mês?')}s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(/^sim\b/.test(q)){s.p='bank';return rep('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?')}if(/^nao\b|nao tenho/.test(q)){s.p='turnover';return rep('Entendi, '+s.name+'. E quanto sua empresa fatura aproximadamente por mês?')}return rep('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?')}if(s.p==='bank'){let b=bank(q)||x.trim();if(b==='Santander'&&/\bpf\b|pessoa fisica/.test(q)){s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que sua conta Santander é pessoa física. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(b==='Santander'){s.p='closed';return rep('Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base Santander. Nesse caso, peço que procure o especialista responsável pela sua conta ou a agência responsável pelo seu CNPJ.')}s.bank=b;if(hasM(q)){s.machine=machine(q)||b;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi que você utiliza conta e máquina do '+b+'. Quanto sua empresa fatura aproximadamente por mês?')}s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(s.p==='machine'){s.machine=machine(q)||x;s.p='turnover';return rep('Perfeito, '+s.name+'. Quanto sua empresa fatura aproximadamente por mês?')}if(s.p==='turnover'){let v=money(q);if(!v)return rep('Pode me passar uma média mesmo, '+s.name+'. Não precisa ser exato.');s.p='pain';return rep('Perfeito, '+s.name+'. Então estamos falando de uma empresa '+faixa(v)+'. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?')}if(s.p==='pain'){s.p='advance';return rep('Entendi, '+s.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, já avançar?')}if(s.p==='advance'){s.p='meeting';return rep('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?')}if(s.p==='meeting'){if(/online|virtual|remota/.test(q))s.mode='online';if(/presencial|pessoalmente/.test(q))s.mode='presencial';let tm=q.match(/\b([01]?\d|2[0-3])\s*(?:h|hrs|horas)\b/);if(!tm)tm=q.match(/\b(?:as|às)\s*([01]?\d|2[0-3])\b/);if(tm)s.time=tm[1].padStart(2,'0')+'h';let day=q.match(/\b(2a|3a|4a|5a|6a|7a)\b/);let names={'2a':'segunda','3a':'terça','4a':'quarta','5a':'quinta','6a':'sexta','7a':'sábado'};if(day){s.day=names[day[1]];let d=new Date();let target=['domingo','segunda','terça','quarta','quinta','sexta','sábado'].indexOf(s.day),delta=(target-d.getDay()+7)%7;if(delta===0)delta=7;d.setDate(d.getDate()+delta);s.date=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}if(/amanha/.test(q)){s.day='amanhã';let d=new Date(Date.now()+86400000);s.date=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}if(s.mode&&s.day&&s.time){s.p='confirmed';return rep('Perfeito, '+s.name+'. Reunião confirmada: '+s.mode+', '+s.day+', dia '+s.date+' às '+s.time+'. Até lá!')}if(s.mode)return rep('Perfeito, '+s.name+'. Qual dia e horário ficam melhores para você?');return rep('Perfeito, '+s.name+'. Você prefere fazer online ou pessoalmente?')}if(s.p==='confirmed')return rep('Perfeito, '+s.name+'. Até lá! 👋')}novo();i.addEventListener('keydown',e=>{if(e.key==='Enter')env()})</script>
