name: V1 Core Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Run SDR regression tests
        run: node backend/core/pipeline.test.js
      - name: Run decision contract tests
        run: node backend/core/decision-contract.test.js
      - name: Run state transition tests
        run: node backend/core/transition-guard.test.js
      - name: Run pipeline integration tests
        run: node backend/core/pipeline.integration.test.js
      - name: Run server environment tests
        run: node backend/config/env.test.js
      - name: Run Meta WhatsApp adapter tests
        run: node backend/adapters/whatsapp-meta.test.js
      - name: Run Meta webhook HTTP adapter tests
        run: node backend/http/meta-webhook.test.js
      - name: Run webhook security tests
        run: node backend/security/webhook-security.test.js
      - name: Run bounded retry tests
        run: node backend/core/retry.test.js
      - name: Run secret-safe logging tests
        run: node backend/core/observability.test.js
      - name: Run media normalization tests
        run: node backend/core/media.test.js
      - name: Run privacy data policy tests
        run: node backend/privacy/data-policy.test.js
      - name: Run AI provider secret guard tests
        run: node backend/ai/provider.test.js
      - name: Run Meta-to-SDR end-to-end contract
        run: node backend/core/e2e-contract.test.js
      - name: Run acquisition attribution tests
        run: node backend/core/attribution.test.js
      - name: Run canonical acquisition source tests
        run: node backend/core/acquisition-sources.test.js
      - name: Run lead scoring tests
        run: node backend/core/lead-scoring.test.js
      - name: Run lead routing tests
        run: node backend/core/lead-routing.test.js
      - name: Run lead record projection tests
        run: node backend/core/lead-record.test.js
      - name: Run CRM synchronization tests
        run: node backend/core/crm-sync.test.js
      - name: Run HTTP server health test
        run: node backend/server.test.js
      - name: Run HTTP server configuration test
        run: node backend/http/server-config.test.js
      - name: Run commercial license tests
        run: node backend/licensing/license.test.js
      - name: Run tenant access tests
        run: node backend/licensing/tenant-access.test.js
      - name: Run commercial license policy tests
        run: node backend/licensing/license-policy.test.js
      - name: Run commercial entitlement tests
        run: node backend/licensing/entitlements.test.js
