name: V1 Core Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run SDR regression tests
        run: node backend/core/pipeline.test.js
      - name: Run decision contract tests
        run: node backend/core/decision-contract.test.js
      - name: Run state transition tests
        run: node backend/core/transition-guard.test.js
      - name: Run pipeline integration tests
        run: node backend/core/pipeline.integration.test.js
