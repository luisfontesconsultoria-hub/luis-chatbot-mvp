name: V1 Core Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run SDR regression tests
        run: node backend/core/pipeline.test.js
      - name: Run decision contract tests
        run: node backend/core/decision-contract.test.js
      - name: Run state transition tests
        run: node backend/core/transition-guard.test.js
      - name: Run pipeline integration tests
        run: node backend/core/pipeline.integration.test.js
      - name: Run server environment tests
        run: node backend/config/env.test.js
      - name: Run Meta WhatsApp adapter tests
        run: node backend/adapters/whatsapp-meta.test.js
      - name: Run Meta webhook HTTP adapter tests
        run: node backend/http/meta-webhook.test.js
      - name: Run webhook security tests
        run: node backend/security/webhook-security.test.js
      - name: Run bounded retry tests
        run: node backend/core/retry.test.js
      - name: Run secret-safe logging tests
        run: node backend/core/observability.test.js
      - name: Run media normalization tests
        run: node backend/core/media.test.js
      - name: Run privacy data policy tests
        run: node backend/privacy/data-policy.test.js
