.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');function add(t,u){c.innerHTML+='<div class="m '+(u?'u':'ai')+'">'+t+'</div>';c.scrollTop=c.scrollHeight}function rep(t){ty.textContent='digitando...';setTimeout(()=>{ty.textContent='';add(t)},650+Math.min(t.length*5,500))}function novo(){s={p:'name',name:''};c.innerHTML='';ops.style.display='none';add('Oi! Tudo bem? Aqui é o Luís.');setTimeout(()=>add('Com quem eu estou falando?'),450)}function env(){let x=i.value.trim();if(!x)return;add(x,1);i.value='';setTimeout(()=>go(x),250)}function decidir(ok){if(s.p!=='availability')return;ops.style.display='none';if(ok){s.p='account';rep('Perfeito, '+s.name+'. A consulta foi concluída e temos disponibilidade para esta solução. Vamos continuar. Hoje você já possui uma conta PJ? Se sim, qual banco você utiliza?')}else{s.p='closed';rep('Entendi, '+s.name+'. Consultei a disponibilidade para este CNPJ e, neste momento, não temos a solução disponível. Agradeço pelo contato e, se houver mudança na disponibilidade, poderemos avaliar novamente.')}}function bank(q){let a=[['banco do brasil','Banco do Brasil'],[' bb','Banco do Brasil'],['santander','Santander'],['itau','Itaú'],['bradesco','Bradesco'],['caixa','Caixa'],['banrisul','Banrisul'],['sicredi','Sicredi'],['sicoob','Sicoob'],['nubank','Nubank'],['picpay','PicPay'],['pic pay','PicPay'],['c6','C6 Bank'],['mercado pago','Mercado Pago'],['mercadopago','Mercado Pago'],['pagseguro','PagBank'],['pagbank','PagBank'],['original','Banco Original'],['btg','BTG Pactual'],['safra','Safra'],['daycoval','Daycoval'],['neon','Neon'],['next','Next'],['pan','Banco PAN'],['bmg','BMG'],['xp','XP'],['iti','iti'],['inter','Inter']];for(let [k,v] of a)if(q.includes(k.trim()))return v;return null}function machine(q){let a=[['stone','Stone'],['cielo','Cielo'],['getnet','Getnet'],['rede','Rede'],['pagseguro','PagSeguro'],['pagbank','PagSeguro'],['mercado pago','Mercado Pago'],['mercadopago','Mercado Pago'],['sumup','SumUp']];for(let [k,v] of a)if(q.includes(k))return v;return null}function hasM(q){return /maquin|maquinh|cartao|pos\b/.test(q)}function hasConta(q){return /\bconta\b/.test(q)}function money(q){let x=norm(q).replace(/r\$|reais|real/g,' '),m=x.match(/([0-9]+(?:[.,][0-9]+)?)\s*(milhao|milhoes|mi|m|mil|ml|k)\b/);if(m){let v=parseFloat(m[1].replace(',','.'));return ['milhao','milhoes','mi','m'].includes(m[2])?v*1000000:v*1000}let n=x.match(/\d[\d.]*(?:,\d+)?/);if(!n)return 0;let z=n[0];if(z.includes(',')&&z.includes('.'))z=z.replace(/\./g,'').replace(',','.');else if(z.includes(','))z=z.replace(',','.');else if(/\.\d{3}$/.test(z))z=z.replace('.','');return parseFloat(z)||0}function faixa(v){if(v<=10000)return'até R$ 10 mil';if(v<=40000)return'acima de R$ 10 mil e até R$ 40 mil';if(v<=100000)return'acima de R$ 40 mil e até R$ 100 mil';return'acima de R$ 100 mil'}function agenda(q){if(/online|virtual|remota/.test(q))s.mode='online';if(/presencial|pessoalmente/.test(q))s.mode='presencial';let tm=q.match(/\b(?:as|às)?\s*([01]?\d|2[0-3])\s*(?:h|hrs|horas)\b/);if(tm)s.time=tm[1].padStart(2,'0')+'h';let d=q.match(/\b(2a|3a|4a|5a|6a|7a)\b/),names={'2a':'segunda','3a':'terça','4a':'quarta','5a':'quinta','6a':'sexta','7a':'sábado'};if(d){s.day=names[d[1]];let now=new Date(),target=['domingo','segunda','terça','quarta','quinta','sexta','sábado'].indexOf(s.day),delta=(target-now.getDay()+7)%7;if(delta===0)delta=7;now.setDate(now.getDate()+delta);s.date=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear()}if(/amanha/.test(q)){s.day='amanhã';let now=new Date(Date.now()+86400000);s.date=String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+now.getFullYear()}if(s.mode&&s.day&&s.time){s.p='confirmed';return rep('Perfeito, '+s.name+'. Reunião confirmada: '+s.mode+', '+s.day+', dia '+s.date+' às '+s.time+'. Até lá!')}return rep(s.mode?'Perfeito, '+s.name+'. Qual dia e horário ficam melhores para você?':'Perfeito. Você prefere fazer uma conversa rápida online ou pessoalmente?')}function go(x){let q=norm(x);if(s.p==='name'){s.name=x.trim().split(/\s+/)[0]||x;s.p='interest';return rep('Prazer, '+s.name+'! Me conta, o que você está procurando hoje para sua empresa?')}if(s.p==='interest'){s.p='cnpj';return rep('Perfeito, '+s.name+'. Para eu verificar a disponibilidade das soluções para sua empresa, me informe o CNPJ, por favor.')}if(s.p==='cnpj'){if(x.replace(/\D/g,'').length<11)return rep('Pode me informar o CNPJ completo, por favor?');s.cnpj=x;s.p='availability';ops.style.display='block';add('CNPJ recebido. Aguardando a verificação interna de disponibilidade.',0);return}if(s.p==='availability'||s.p==='closed'||s.p==='confirmed')return;if(s.p==='account'){let b=bank(q),m=machine(q);if(b==='Santander'){if(/\bpf\b|pessoa fisica/.test(q)){s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que sua conta Santander é pessoa física. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}s.p='closed';return rep('Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base Santander. Nesse caso, peço que procure o especialista responsável pela sua conta ou a agência responsável pelo seu CNPJ.')}if(hasConta(q)&&m&&!b&&/conta.*maquin|maquin.*conta|tanto conta.*maquin|conta.*sao.*com|conta.*são.*com|os dois|os dois sao|ambas/.test(q)){s.bank=m;s.machine=m;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi. Você utiliza a conta e a máquina da '+m+'. Quanto sua empresa fatura aproximadamente por mês?')}if(b){s.bank=b;if(hasM(q)){s.machine=m||b;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi que você utiliza conta e máquina do '+b+'. Quanto sua empresa fatura aproximadamente por mês?')}s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(/^sim\b/.test(q)){s.p='bank';return rep('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?')}if(/^nao\b|nao tenho/.test(q)){s.p='turnover';return rep('Entendi, '+s.name+'. E quanto sua empresa fatura aproximadamente por mês?')}if(m&&hasConta(q)){s.bank=m;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi. Você utiliza a conta e a máquina da '+m+'. Quanto sua empresa fatura aproximadamente por mês?')}return rep('Perfeito, '+s.name+'. Qual banco você utiliza atualmente na sua conta PJ?')}if(s.p==='bank'){let b=bank(q),m=machine(q);if(b==='Santander'&&/\bpf\b|pessoa fisica/.test(q)){s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que sua conta Santander é pessoa física. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(b==='Santander'){s.p='closed';return rep('Entendi, '+s.name+'. Hoje trabalho somente com captação de novos clientes e não consigo atender clientes que já fazem parte da base Santander. Nesse caso, peço que procure o especialista responsável pela sua conta ou a agência responsável pelo seu CNPJ.')}if(b){s.bank=b;if(hasM(q)){s.machine=m||b;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi que você utiliza conta e máquina do '+b+'. Quanto sua empresa fatura aproximadamente por mês?')}s.p='machine';return rep('Perfeito, '+s.name+'. Entendi que você utiliza o '+b+'. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(m&&hasConta(q)){s.bank=m;s.machine=m;s.p='turnover';return rep('Perfeito, '+s.name+'. Entendi. Você utiliza a conta e a máquina da '+m+'. Quanto sua empresa fatura aproximadamente por mês?')}s.bank=x.trim();s.p='machine';return rep('Perfeito, '+s.name+'. Entendi. E hoje você também utiliza alguma máquina de cartão? Se sim, qual?')}if(s.p==='machine'){s.machine=machine(q)||x;s.p='turnover';return rep('Perfeito, '+s.name+'. Quanto sua empresa fatura aproximadamente por mês?')}if(s.p==='turnover'){let v=money(q);if(!v)return rep('Pode me passar uma média mesmo, '+s.name+'. Não precisa ser exato.');s.p='pain';return rep('Perfeito, '+s.name+'. Então estamos falando de uma empresa '+faixa(v)+'. O que mais pesa para você hoje: taxa, suporte, prazo de recebimento ou custo da operação?')}if(s.p==='pain'){s.p='advance';return rep('Entendi, '+s.name+'. Se eu conseguir uma condição que realmente melhore esse ponto, faz sentido a gente comparar e, se compensar para você, já avançar?')}if(s.p==='advance'){s.p='meeting';return rep('Perfeito. A gente pode fazer uma conversa rápida online ou, se preferir, pessoalmente. Qual dos dois fica melhor para você?')}if(s.p==='meeting')return agenda(q)}novo();i.addEventListener('keydown',e=>{if(e.key==='Enter')env()})</script></html>
